services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-5173}:5173"
    environment:
      - WORKSPACE_DIR=/data/workspace
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=5173
      - TZ=${TZ:-America/New_York}
      - ORIGIN=${ORIGIN:-http://localhost:5173}
    volumes:
      - ./workspace:/data/workspace